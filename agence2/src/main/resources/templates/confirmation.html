<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmation de réservation</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            padding: 20px;
            margin: 0;
        }

        .card {
            background: #fff;
            padding: 35px 30px;
            border-radius: 20px;
            max-width: 520px;
            margin: 60px auto;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-icon {
            font-size: 60px;
            color: #2a9d8f;
            margin-bottom: 15px;
        }

        h2 {
            color: #1e3a8a;
            margin-bottom: 12px;
            font-size: 28px;
        }

        p {
            font-size: 16px;
            margin: 10px 0;
            color: #333;
        }

        .reference {
            display: inline-block;
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            color: #fff;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 18px;
            margin-top: 15px;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 28px;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .btn:hover {
            background: #16306d;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="card">
    <div class="success-icon">&#10004;</div>
    <h2>Réservation confirmée !</h2>
    <p>Votre référence de réservation :</p>
    <div class="reference" th:text="${reference}"></div>

    <!-- Nouveau message ajouté -->
    <p>Vous avez à votre disposition votre PDF de réservation.</p>

    <p><a th:href="@{/agence/reservations}" class="btn">Voir mes réservations</a></p>
</div>


</body>
</html>
