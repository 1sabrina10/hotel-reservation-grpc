server.port = 8082
spring.application.name=AgenceSoap

# gRPC Server Configuration
grpc.server.port=9093

# gRPC Client Configuration (pour appeler les hôtels)
grpc.client.hotel1.address=static://localhost:9091
grpc.client.hotel1.negotiationType=plaintext
grpc.client.hotel2.address=static://localhost:9092
grpc.client.hotel2.negotiationType=plaintext
spring.datasource.url=jdbc:mysql://localhost:3306/hotel?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_new_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Logging d�taill� pour Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
