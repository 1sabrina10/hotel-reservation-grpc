<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion Agence</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background: linear-gradient(to right, #4e54c8, #8f94fb);
            height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; }
        .login-container { background: #fff; padding: 40px 50px; border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 350px; }
        .login-container h2 { text-align: center; margin-bottom: 30px; color: #4e54c8; }
        .login-container form { display: flex; flex-direction: column; }
        .login-container label { margin-bottom: 5px; font-weight: 500; color: #333; }
        .login-container input { padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 10px; font-size: 14px; }
        .login-container button { padding: 12px; border: none; border-radius: 10px; background: #4e54c8; color: #fff; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        .login-container button:hover { background: #3b40a4; }
        .login-container .footer { text-align: center; margin-top: 15px; font-size: 12px; color: #666; }
        .error { color: red; text-align: center; margin-bottom: 15px; }
        @media (max-width: 400px) { .login-container { width: 90%; padding: 30px 20px; } }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Connexion Agence</h2>

    <form th:action="@{/login}" method="post">
        <input type="hidden" name="agenceId" th:value="${agenceId}" />
        <input type="hidden" name="offreId" th:value="${offreId}" />
        <label>Email</label>
        <input type="email" name="email" placeholder="Votre email" required />

        <label>Mot de passe</label>
        <input type="password" name="password" placeholder="Votre mot de passe" required />

        <button type="submit">Se connecter</button>
    </form>

    <p th:if="${error}" th:text="${error}" class="error"></p>

    <div class="footer">
        &copy; 2025 Agence - Tous droits réservés
    </div>
</div>

</body>
</html>
