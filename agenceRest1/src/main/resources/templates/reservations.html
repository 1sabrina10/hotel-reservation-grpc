<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mes réservations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom right, #E0F7FF, #FFFFFF); /* Dégradé clair */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* pleine hauteur */
            margin: 0;
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #1E90FF; /* titre en bleu */
        }

        input[type=text] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            background: #FF6B6B; /* rouge doux */
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px; /* petit espace entre boutons */
        }

        button:hover {
            background: #E55B5B;
        }

        .success {
            color: green;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .error {
            color: red;
            margin-bottom: 15px;
            font-weight: bold;
        }

        label {
            display: block;
            text-align: left;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Annuler une réservation</h2>

    <p class="success" th:if="${success}" th:text="${success}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/agence/reservations/annuler}" method="post">
        <label>Référence de réservation :</label>
        <input type="text" name="reference" placeholder="Ex : RES-1764876324690" required>

        <button type="submit">Annuler la réservation</button>

    </form>

</div>

</body>
</html>
