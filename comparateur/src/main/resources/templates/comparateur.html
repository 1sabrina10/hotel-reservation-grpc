<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Comparateur d'hôtels</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #1E90FF;   /* bleu vif pour titres et icônes */
            --accent: #00BFFF;    /* bleu clair pour prix et liens */
            --card-bg: #FFFFFF;    /* fond des cartes */
            --border-color: #E0E0E0;
        }

        html, body {
            margin:0;
            font-family:"Roboto","Helvetica",Arial,sans-serif;
            background: linear-gradient(to bottom, #E0F7FF, #FFFFFF); /* dégradé bleu clair vers blanc */
            color:#222;
        }

        header {
            text-align:center;
            padding:32px 16px;
        }
        header h1 {
            margin:0;
            color:var(--primary);
            font-size:28px;
        }

        .search-form {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            max-width: 1200px;
            margin: 20px auto;
            padding: 14px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        .field {
            position: relative;
            flex: 1 1 200px;
            min-width: 150px;
        }
        .field i {
            position:absolute;
            left:10px;
            top:50%;
            transform:translateY(-50%);
            color:var(--primary);
        }
        .field input[type="text"],
        .field input[type="number"],
        .field input[type="date"] {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            box-sizing: border-box;
        }

        .btn-search {
            background:var(--primary);
            color:#fff;
            border:none;
            padding:10px 18px;
            border-radius:8px;
            cursor:pointer;
            font-weight:600;
            flex:0 0 auto;
        }
        .btn-search:hover { filter:brightness(0.95); }

        /* Container offres */
        .container {
            max-width:1200px;
            margin:26px auto;
            padding:0 12px;
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap:20px;
        }

        .card {
            background:var(--card-bg);
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 6px 20px rgba(0,0,0,0.08);
            transition:transform .18s, box-shadow .18s;
            display:flex;
            flex-direction:column;
            cursor:pointer;
        }
        .card:hover { transform:translateY(-6px); box-shadow:0 10px 30px rgba(0,0,0,0.12); }

        .card .photo { width:100%; height:170px; object-fit:cover; background:#e9eef6; }

        .card-body { padding:14px 16px; display:flex; flex-direction:column; gap:8px; flex:1; }

        .hotel-name { font-size:18px; color:var(--primary); font-weight:700; margin:0; display:flex; align-items:center; gap:8px; }
        .hotel-address { font-size:13px; color:#333; margin:0; }
        .gps-link { font-size:13px; color:var(--accent); text-decoration:none; font-weight:600; }
        .gps-link:hover { text-decoration:underline; }

        .meta-row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
        .type { font-size:13px; color:#333; font-weight:600; }
        .stars { color:#f5a623; font-size:13px; }

        .price-row { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:6px; }
        .price { font-size:18px; color:var(--accent); font-weight:800; }
        .reduction { font-size:13px; color:#d93025; font-weight:700; }

        .ids { font-size:12px; color:#666; text-align:right; margin-top:auto; }

        @media (max-width:520px){
            .search-form { padding:12px; }
            .hotel-name { font-size:16px; }
            .price { font-size:16px; }
        }
    </style>
</head>
<body>

<header>
    <h1>Comparateur d'hôtels</h1>
</header>

<form id="searchForm" class="search-form" onsubmit="return false;">
    <div class="field"><i class="fas fa-city"></i><input type="text" id="ville" placeholder="Ville" required></div>
    <div class="field"><i class="fas fa-user"></i><input type="number" id="nbrPersonnes" min="1" value="1" required></div>
    <div class="field"><i class="fas fa-calendar"></i><input type="date" id="dateDebut" required></div>
    <div class="field"><i class="fas fa-calendar"></i><input type="date" id="dateFin" required></div>
    <button class="btn-search" id="btnSearch" type="button">Rechercher</button>
</form>

<div id="resultInfo" style="max-width:1200px;margin:12px auto;text-align:center;color:#333;"></div>
<div class="container" id="offresContainer"></div>

<script>
    function safeId(val) { return (val !== null && val !== undefined) ? val : "-"; }
    function imageOrPlaceholder(img) {
        if(img && img.trim()!=="")
            return (img.startsWith("http") || img.startsWith("data:")) ? img : "data:image/jpeg;base64," + img;
        return "https://via.placeholder.com/600x340?text=Hotel";
    }
    function escapeHtml(s){
        if(!s && s!==0) return '';
        return String(s)
            .replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;")
            .replace(/'/g,"&#039;");
    }
    function renderStars(n){ n = Number(n)||0; return n>0 ? '★'.repeat(Math.min(5,n)) : ""; }
    function formatPrice(p){ if(p===null||p===undefined) return '-'; return Number(p).toFixed(2)+' €'; }

    document.getElementById('btnSearch').addEventListener('click', ()=>{
        const ville = document.getElementById('ville').value.trim();
        const nbPersonnes = Number(document.getElementById('nbrPersonnes').value)||1;
        const dateDebutRaw = document.getElementById('dateDebut').value;
        const dateFinRaw = document.getElementById('dateFin').value;

        if(!ville || !dateDebutRaw || !dateFinRaw){
            alert("Remplis la ville et les dates.");
            return;
        }

        const dateDebut = new Date(dateDebutRaw).getTime();
        const dateFin   = new Date(dateFinRaw).getTime();

        const email = "agence1@gmail.com";
        const password = "agence1";

        const url = `/comparateur/offres?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}&nbPersonnes=${nbPersonnes}&ville=${encodeURIComponent(ville)}&dateDebut=${dateDebut}&dateFin=${dateFin}`;

        console.log("Requête:", url);

        fetch(url)
            .then(resp => { if(!resp.ok) throw new Error("Erreur réseau:"+resp.status); return resp.json(); })
            .then(data => renderOffres(data))
            .catch(err => {
                console.error(err);
                document.getElementById('resultInfo').innerText = "Erreur lors de la récupération des offres.";
                document.getElementById('offresContainer').innerHTML = '';
            });
    });

    function renderOffres(data){
        const container = document.getElementById('offresContainer');
        container.innerHTML = '';

        if(!Array.isArray(data) || data.length === 0){
            document.getElementById('resultInfo').innerText="Aucune offre trouvée.";
            return;
        }

        document.getElementById('resultInfo').innerText = `Nombre d'offres trouvées : ${data.length}`;

        data.forEach(o => {

            const c = o.chambreDTO || {};
            const agenceId = safeId(o.agenceId);
            const offreId  = safeId(o.offreId);
            const photo = imageOrPlaceholder(c.image || c.imageUrl);

            const adresse = c.adresse ?
                `${c.adresse.numero||''} ${c.adresse.rue||''}, ${c.adresse.ville||''}, ${c.adresse.pays||''}`
                : '';

            const gps = c.adresse?.gps || '';
            const gpsAnchor = gps
                ? `<a class="gps-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(gps)}" target="_blank"><i class="fas fa-location-dot"></i> ${gps}</a>`
                : '';

            const card = document.createElement('div');
            card.className = 'card';

            card.innerHTML = `
                <img class="photo" src="${photo}" alt="photo hotel">
                <div class="card-body">
                    <div class="hotel-name">${escapeHtml(c.nomHotel || 'Hôtel')}</div>
                    <div class="hotel-address">${escapeHtml(adresse)}</div>
                    <div>${gpsAnchor}</div>

                    <div class="meta-row">
                        <div><strong>Type :</strong> ${escapeHtml(c.type || '-')}</div>
                        <div class="stars">${renderStars(c.etoiles)}</div>
                    </div>

                    <div class="price-row">
                        <div class="price">${formatPrice(c.prix)}</div>
                        <div class="reduction">${c.reduction ? ('-' + (c.reduction * 100) + '%') : ''}</div>
                    </div>

                    <div class="ids">
                        Offre ID : ${offreId} | Agence : ${agenceId}
                    </div>
                </div>
            `;

       if (offreId !== "-") {
    card.addEventListener('click', () => {
        // Déterminer le port selon l'agence
        let port = (agenceId == 1) ? 8081 : 8082;

        window.location.href = `http://localhost:${port}/login?agenceId=${encodeURIComponent(agenceId)}&offreId=${encodeURIComponent(offreId)}`;
    });
}

            container.appendChild(card);
        });
    }
</script>
</body>
</html>
